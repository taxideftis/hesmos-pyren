# hesmos-ffi — PyO3 boundary crate (FFI-1 surface, Stephen single owner per boundary rule 2).
# P2b: the surface now hosts its own composition root (D-7 — binary crates cannot be
# depended on, so hesmos/src/composition.rs cannot be reused; this module re-implements
# the adapters over the same workspace crates, ~40 lines each, no new logic).
[package]
name = "hesmos-ffi"
version.workspace = true
edition.workspace = true

[lib]
# maturin places the cdylib at hesmos/_ffi.<abi>.so (pyproject module-name = "hesmos._ffi")
name = "_ffi"
crate-type = ["cdylib"]

[dependencies]
# pyo3 is declared locally: hesmos-ffi is its only consumer in the workspace (maturin
# pins the 0.28 Bound API), so it does not belong in [workspace.dependencies].
pyo3 = "0.28"
# float_roundtrip matters here too: marshaled floats (gate scores) must round-trip
# bit-exactly or chain hashes diverge between Rust and Python views.
serde_json.workspace = true
serde_yaml_ng.workspace = true
ulid.workspace = true
# Ladder rung 2 (reuse of existing workspace crates — no new external deps): the
# session_run path composes the same machinery the CLI composes. Internal crates use
# path deps (workspace convention — no [workspace.dependencies] entries for members).
hesmos-core = { path = "../hesmos-core" }
hesmos-orchestrator = { path = "../hesmos-orchestrator" }
hesmos-guard = { path = "../hesmos-guard" }
hesmos-budget = { path = "../hesmos-budget" }
hesmos-trace = { path = "../hesmos-trace" }
