# Suite example — eval/suites/report.yaml (CLI-5 `hesmos eval`, the WP-P3a harness).
#
# THIS FILE PARSES AGAINST THE CURRENT HARNESS (hesmos/src/cmd/eval.rs):
#   SuiteFile { name, cases: [ { id, session, at?, budget? } ] } — deny_unknown_fields.
# Every key below is load-bearing; an unknown key is an EVAL-CONFIG error (exit 3),
# so this file doubles as the format fixture for tests/python/test_eval_judge.py.
#
# GOLDEN APPROVAL: `hesmos eval report --bless <session_id>` RUNS the matching case
# once and records the observed structure as <suite>.golden.yaml. eval itself never
# writes a golden — an unapproved case is an exit-3 error with the bless hint.
# The rerun comparison is STRUCTURE ONLY (node path + gate verdicts, SS-22 rule 1);
# each case forks its origin (same seed / plan_hash / response cache, SS-14 rule 4)
# and the fork is throwaway (never sealed).
#
# JUDGE SEAT (WP-P3b, W6 format contract — deliberately NOT in the CLI schema yet):
#   Judge evidence is already RECORDED by the session path (US-26): `@core.judge`
#   (hesmos.eval_judge.JudgeConfig) runs after a node's reply and the node's post
#   gate events carry judge.prompt_hash / judge.temperature / judge.model_version.
#   The suite-side judge field is absent because deny_unknown_fields would reject
#   it today. When the harness grows its judge bridge (W6), the intended per-case
#   shape is:
#
#     judge:
#       model: glm-5.3-flash        # same adapter path as agents (ADR-0005 rule 4)
#       temperature: 0.0            # fixed — drift tracking; never omitted / None
#       prompt: judge/report.v3.md  # recorded as sha256(prompt text) = judge.prompt_hash
#
#   until then, judge evidence is asserted from gate-event attrs in Python tests.

name: report

cases:
  - id: report-happy
    # The recorded (origin) session this case re-executes as a fork.
    session: 01M2Q098MPY7Z3ZW9PDAQV6066
    # Optional. Commit point to fork at; absent = 0 = whole-session replay.
    at: 0
    # Optional. Re-pin the fork envelope (`tokens=N`); absent = the origin's budget.
    budget: tokens=250000

  - id: report-minimal
    session: 01M2Q098MP3BM6K6ZQRX95TPPF
