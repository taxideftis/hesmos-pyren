[package]
name = "hesmos"
version.workspace = true
edition.workspace = true
description = "Agent Hesmos CLI — run/trace/budget/eval (+serve behind the `serve` feature)"

# Lib + bin split: the library holds the CLI contracts' implementations (dispatch
# functions, message catalog, exit map, composition-root adapters) so the E2E harness
# (tests/integration_rust) can drive them in-process; the binary is a thin parse+exit
# shell over `hesmos::cmd`.
[lib]
name = "hesmos"
path = "src/lib.rs"

[[bin]]
name = "hesmos"
path = "src/main.rs"

[dependencies]
# CLI parsing (WP-P0a surface; flags land with their CLI-1..5 contracts).
clap.workspace = true
# Composition root (WP-P1e): the adapters below wire guard/budget/trace into the
# orchestrator's seam traits — this is the ONLY place sibling crates meet the runner.
hesmos-core = { path = "../crates/hesmos-core" }
hesmos-orchestrator = { path = "../crates/hesmos-orchestrator" }
hesmos-guard = { path = "../crates/hesmos-guard" }
hesmos-budget = { path = "../crates/hesmos-budget" }
hesmos-trace = { path = "../crates/hesmos-trace" }
serde_json.workspace = true
serde_yaml_ng.workspace = true
serde.workspace = true
# Cooperative SIGINT (CLI-1 exit 130): flips the runner's shared interrupt flag.
ctrlc.workspace = true

# SS-24/P8: the serve command maps onto the gateway's public API only (D-4). The
# dependency is optional so the default build carries no HTTP stack.
gateway = { path = "../gateway", optional = true }

[features]
# Pre-wired in WP-P0a (code-structure §4): `cargo build -p hesmos --features serve`
# compiles; the dispatch seat exists — implementation is Andrew's (WP-P3c, serve.rs).
serve = ["dep:gateway"]
# SS-25 (ADR-0007): forwards to hesmos-trace's `otel` feature — the default CLI
# build contains no remote send path; a feature build still exports nothing unless
# HESMOS_OTEL_ENDPOINT is set (composition::progress_sink holds the runtime key).
otel = ["hesmos-trace/otel"]
