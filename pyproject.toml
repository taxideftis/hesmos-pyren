# hesmos-py packaging (WP-P0c) — maturin mixed layout: PyO3 extension + pure Python.
# Import name is "hesmos" per api-contracts PY-1 (`import hesmos`); the PyO3 native
# module is exposed as hesmos._ffi and wrapped by the pure Python surface.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hesmos"
version = "0.1.0"
description = "Agent Hesmos — Python layer over the deterministic Rust core (FFI-1 surface only)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1"]

[tool.maturin]
python-source = "bindings/python"
module-name = "hesmos._ffi"
# abi3 wheel: one build serves all CPython >= 3.11 (story §6 pins PyO3 0.28.x, MSRV 1.83)
features = ["pyo3/abi3-py311"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
